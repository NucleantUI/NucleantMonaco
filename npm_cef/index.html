<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monaco Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #cccccc;
        }

        #workbench {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        #editor-container {
            flex: 1;
            min-height: 0;
        }

        /* The console panel: hidden until shown from the native side, or
           by the wasm module. */
        #console-container {
            display: none;
            flex-direction: column;
            height: 30%;
            min-height: 80px;
            border-top: 1px solid #3c3c3c;
        }

        #console-container.visible {
            display: flex;
        }

        #console-header {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 28px;
            padding: 0 8px 0 12px;
            background: #252526;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        #console-header .title {
            flex: 1;
        }

        #console-header button {
            border: none;
            background: none;
            color: #cccccc;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
        }

        #console-header button:hover {
            background: #3c3c3c;
        }

        #console-output {
            flex: 1;
            min-height: 0;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #858585;
            font-size: 14px;
            text-align: center;
        }

        #loading::after {
            content: '';
            display: block;
            width: 40px;
            height: 40px;
            margin: 16px auto 0;
            border: 3px solid #3c3c3c;
            border-top-color: #007acc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        #loading.failed::after {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loaded #loading {
            display: none;
        }
    </style>
</head>
<body>
    <div id="loading">Loading editor…</div>
    <div id="workbench">
        <div id="editor-container"></div>
        <div id="console-container">
            <div id="console-header">
                <span class="title">Output</span>
                <button id="console-clear" title="Clear">Clear</button>
                <button id="console-close" title="Close">✕</button>
            </div>
            <div id="console-output"></div>
        </div>
    </div>
</body>
</html>
